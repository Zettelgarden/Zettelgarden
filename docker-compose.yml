# Zettelgarden — local dev / self-host compose file.
#
# REQUIRED: a root `.env` file. It is not committed (see .gitignore, which
# ignores .env but keeps .env.example); create it from the committed example
# before running anything:
#
#     cp .env.example .env
#     docker compose up --build
#
# Every variable the stack reads is documented in .env.example. The go-backend
# loads it via `env_file: .env`; the frontend build picks up the VITE_* values
# as build args (build-time only — see the args block below).
version: "3"

services:
  frontend:
    build:
      context: ./zettelkasten-front
      dockerfile: Dockerfile
      args:
        # Vite inlines VITE_* vars at BUILD time, so they must be passed here
        # (and declared as ARGs in the Dockerfile). build.sh sources the root
        # .env, so set VITE_OIDC_ENABLED=true there to show the SSO button in
        # prod; it defaults to false (opt-in). VITE_OIDC_LABEL overrides the
        # button text (default "Continue with SSO"). GitHub login shows by
        # default; set VITE_GITHUB_AUTH_ENABLED=false to hide it.
        VITE_URL: ${VITE_URL}
        VITE_ENV: ${VITE_ENV}
        VITE_OIDC_ENABLED: ${VITE_OIDC_ENABLED:-false}
        VITE_OIDC_LABEL: ${VITE_OIDC_LABEL:-}
        VITE_GITHUB_AUTH_ENABLED: ${VITE_GITHUB_AUTH_ENABLED:-true}
    image: nsavage/zettelgarden_frontend:latest
    ports:
      - "3001:3000"
    environment:
      - VITE_URL=${VITE_URL}
      - VITE_ENV=${VITE_ENV}

  go-backend:
    build:
      context: ./go-backend
      dockerfile: Dockerfile
    image: nsavage/zettelgarden_go_backend:latest
    ports:
      - "8080:8080"
    env_file:
      - .env
    volumes:
      # Persist the SQLite DB (default ./data/zettelgarden.db) on the host.
      - ./go-backend/data:/usr/src/app/data

# Transactional email is sent directly from the Go backend via SMTP (see the
# Mail section of .env.example). No separate mail container is required: with
# SMTP_HOST unset (or MAIL_ENABLED=false) the backend boots mail-disabled and
# send attempts are no-ops (6er.6). To enable email, set the SMTP_* vars in
# .env (host/port/username/password/from) and recreate the go-backend service.  # --- Optional: Typesense full-text/vector search (OFF by default) ---------
  # Search degrades gracefully to SQL full-text when this service is absent.
  # To enable: uncomment this block, uncomment the TYPESENSE_* vars in .env
  # (TYPESENSE_HOST=http://typesense:8108, TYPESENSE_PASSWORD=<your key>,
  # TYPESENSE_COLLECTION=zettelgarden), then run
  # `docker compose up -d typesense` and recreate the backend.
  # typesense:
  #   image: typesense/typesense:27.1
  #   ports:
  #     - "8108:8108"
  #   environment:
  #     - TYPESENSE_API_KEY=${TYPESENSE_PASSWORD}
  #     - TYPESENSE_DATA_DIR=/data
  #   volumes:
  #     - typesense-data:/data
  #   restart: unless-stopped

