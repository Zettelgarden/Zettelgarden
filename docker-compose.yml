version: "3"

services:
  frontend:
    build:
      context: ./zettelkasten-front
      dockerfile: Dockerfile
      args:
        # Vite inlines VITE_* vars at BUILD time, so they must be passed here
        # (and declared as ARGs in the Dockerfile). build.sh sources the root
        # .env, so set VITE_OIDC_ENABLED=true there to show the SSO button in
        # prod; it defaults to false (opt-in). VITE_OIDC_LABEL overrides the
        # button text (default "Continue with SSO"). GitHub login shows by
        # default; set VITE_GITHUB_AUTH_ENABLED=false to hide it.
        VITE_URL: ${VITE_URL}
        VITE_ENV: ${VITE_ENV}
        VITE_OIDC_ENABLED: ${VITE_OIDC_ENABLED:-false}
        VITE_OIDC_LABEL: ${VITE_OIDC_LABEL:-}
        VITE_GITHUB_AUTH_ENABLED: ${VITE_GITHUB_AUTH_ENABLED:-true}
    image: nsavage/zettelgarden_frontend:latest
    ports:
      - "3001:3000"
    environment:
      - VITE_URL=${VITE_URL}
      - VITE_ENV=${VITE_ENV}

  go-backend:
    build:
      context: ./go-backend
      dockerfile: Dockerfile
    image: nsavage/zettelgarden_go_backend:latest
    ports:
      - "8080:8080"
    env_file:
      - .env
    volumes:
      # Persist the SQLite DB (default ./data/zettelgarden.db) on the host.
      - ./go-backend/data:/usr/src/app/data

  mail-service:
    build:
      context: ./python-mail
      dockerfile: Dockerfile
    image: nsavage/zettelgarden_python_mail:latest
    ports:
      - "8081:8081"
    env_file:
      - .env
