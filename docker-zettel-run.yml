version: '3'

services:
  nginx:
    image: nginx:latest
    ports:
      - "443:443"
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/logs:/var/log/nginx
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - frontend
      - go_backend

  frontend:
    image: nsavage/zettelgarden_frontend:latest
    restart: always
    expose:
      - "3000"
    depends_on:
      - go_backend

  # Backend runs on SQLite (file-based, WAL mode) — no external database
  # service. Set DB_DRIVER=sqlite + SQLITE_PATH in zettel.env (see
  # go-backend/.env.example). The data dir is mounted so the SQLite file
  # persists across container recreation; back it up with `VACUUM INTO`
  # (see docs/runbooks/sqlite-backup.md), NOT a raw cp.
  go_backend:
    image: nsavage/zettelgarden_go_backend:latest
    restart: always
    expose:
      - "8080" 
    env_file:
      - zettel.env
    volumes:
      - /var/log/zettel:/app/logs
      - ./data:/usr/src/app/data

  mail-service:
    image: nsavage/zettelgarden_python_mail:latest
    restart: always
    expose:
      - "8081"
    env_file:
      - zettel.env
    volumes:
      - /var/log/zettel:/app/logs
