# Zettelgarden — sample nginx reverse-proxy config (self-host template).
#
# This is a TEMPLATE, not a drop-in config: replace every YOUR_DOMAIN
# placeholder (server_name, cert paths, log paths) with your own domain
# before mounting it into nginx (see docker-zettel-run.yml). The upstreams
# assume the compose service names from docker-zettel-run.yml.
#
# Example:
#   sed -i 's/YOUR_DOMAIN/example.com/g' nginx/nginx.conf

# Redirect HTTP -> HTTPS
server {
    if ($host = YOUR_DOMAIN) {
        return 301 https://$host$request_uri;
    }
    listen 80;
    server_name YOUR_DOMAIN;
    return 404;
}

server {
    server_name YOUR_DOMAIN;
    client_max_body_size 50m;

    location / {
        proxy_pass      http://frontend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /api {
        proxy_pass http://go_backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_redirect off;
    }

    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/YOUR_DOMAIN/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/YOUR_DOMAIN/privkey.pem;
    access_log /var/log/nginx/YOUR_DOMAIN.access.log;
    error_log /var/log/nginx/YOUR_DOMAIN.error.log;
}
