# Model configuration for Zettelgarden LLM integration
# This file contains pricing and capability information for all supported models

defaults:
  # Default model used when no model is specified
  chat_model: "google/gemini-2.5-flash"
  # Maximum tokens for model responses
  max_tokens: 4096
  # Default temperature for responses
  temperature: 0.7

models:
  google/gemini-2.5-flash:
    provider: google
    prompt_per_1k: 0.0003
    completion_per_1k: 0.0025
    context_window: 1000000
    supports_tools: true
    supports_streaming: true
    description: "Fast, efficient model for quick responses"

  google/gemini-2.5-pro:
    provider: google
    prompt_per_1k: 0.00125
    completion_per_1k: 0.010
    context_window: 1000000
    supports_tools: true
    supports_streaming: true
    description: "High-quality model for complex reasoning"

  google/gemini-2.5-flash-lite:
    provider: google
    prompt_per_1k: 0.0001
    completion_per_1k: 0.0004
    context_window: 1000000
    supports_tools: true
    supports_streaming: true
    description: "Ultra-fast, lightweight model for simple tasks"

  openai/gpt-5-chat:
