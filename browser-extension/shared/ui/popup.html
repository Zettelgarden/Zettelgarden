<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Zettelgarden</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div id="app">
    <!-- Login Screen -->
    <div id="login-screen" class="screen">
      <h2>Zettelgarden</h2>
      <div class="form-group">
        <label>Server URL</label>
        <input type="text" id="server-url" placeholder="https://your-zettelgarden.com">
      </div>
      <div class="form-group">
        <label>Email</label>
        <input type="email" id="email" placeholder="you@example.com">
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="password">
      </div>
      <button id="login-btn" class="primary">Login</button>
      <div id="login-error" class="error hidden"></div>
    </div>

    <!-- Main Screen -->
    <div id="main-screen" class="screen hidden">
      <div class="header">
        <h2>Create Card</h2>
        <button id="logout-btn" class="text-btn">Logout</button>
      </div>

      <div class="tabs">
        <button class="tab active" data-tab="quick">Quick Card</button>
        <button class="tab" data-tab="article">Article</button>
      </div>

      <!-- Quick Card Tab -->
      <div id="quick-tab" class="tab-content">
        <div class="form-group">
          <label>Title</label>
          <input type="text" id="quick-title" placeholder="Card title">
        </div>
        <div class="form-group">
          <label>Content</label>
          <textarea id="quick-body" rows="8" placeholder="Card content (supports markdown)"></textarea>
        </div>
        <button id="create-quick-btn" class="primary">Create Card</button>
      </div>

      <!-- Article Tab -->
      <div id="article-tab" class="tab-content hidden">
        <button id="extract-btn" class="secondary">Extract from Current Page</button>
        <div id="article-preview" class="hidden">
          <div class="form-group">
            <label>Title</label>
            <input type="text" id="article-title">
          </div>
          <div class="form-group">
            <label>Author</label>
            <input type="text" id="article-author">
          </div>
          <div class="form-group">
            <label>Content</label>
            <textarea id="article-body" rows="10"></textarea>
          </div>
          <div class="form-group">
            <label>Source URL</label>
            <input type="text" id="article-url" readonly>
          </div>
          <button id="create-article-btn" class="primary">Create Card</button>
        </div>
      </div>

      <div id="success" class="success hidden"></div>
      <div id="error" class="error hidden"></div>
    </div>
  </div>

  <script src="../content/Readability.js"></script>
  <script src="../api/config.js"></script>
  <script src="../api/auth.js"></script>
  <script src="../api/cards.js"></script>
  <script src="popup.js"></script>
</body>
</html>
