name: Go CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.25'  # go.mod requires go 1.25.0

    - name: Install dependencies
      run: |
        cd go-backend
        go mod download

    - name: Run tests
      env:
        # The suite defaults to a temp file-backed SQLite DB (no external
        # database service required). DB_DRIVER is set for explicitness.
        DB_DRIVER: sqlite
        ZETTEL_IS_TESTING: "true"
        B2_ACCESS_KEY_ID: ${{ secrets.B2_ACCESS_KEY_ID }}
        B2_SECRET_ACCESS_KEY: ${{ secrets.B2_SECRET_ACCESS_KEY }}
        B2_BUCKET_NAME: ${{ secrets.B2_BUCKET_NAME }}
      run: |
        cd go-backend
        go test ./...
