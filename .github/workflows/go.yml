name: Go CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.25'  # go.mod requires go 1.25.0

    - name: Install dependencies
      run: |
        cd go-backend
        go mod download

    - name: Run tests
      env:
        # The suite defaults to a temp file-backed SQLite DB (no external
        # database service required). DB_DRIVER is set for explicitness. File
        # storage defaults to a process temp dir (see tests/conftest.go), so no
        # STORAGE_DIR secret is needed here.
        DB_DRIVER: sqlite
        ZETTEL_IS_TESTING: "true"
      run: |
        cd go-backend
        go test ./...
